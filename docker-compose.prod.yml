x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - craftora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    logging: *default-logging

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: craftora_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - craftora_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    logging: *default-logging

  minio_init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: craftora_minio_init
    profiles: ["disabled"]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set craftora http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing craftora/public-assets &&
      mc mb --ignore-existing craftora/private-products &&
      mc anonymous set download craftora/public-assets &&
      mc anonymous set private craftora/private-products
    networks:
      - craftora_network
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: craftora_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    networks:
      - craftora_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: craftora_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - craftora_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging

  elasticsearch:
    image: elasticsearch:8.13.0@sha256:9d1cd1491778aceca4490de7ec9f205c3633a277df15473e1ea507d13a5270c6
    container_name: craftora_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Faz 0: host portu kapali, security auth mevcut client ile henuz uyumlu degil.
      # Auth acilacaksa client credentials de ayni deploy'da yapilandirilmalidir.
      xpack.security.enabled: ${ELASTICSEARCH_SECURITY_ENABLED:-false}
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - craftora_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 4g
    logging: *default-logging

  craftora_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: craftora_api:prod
    container_name: craftora_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
      ConnectionStrings__Elasticsearch: "http://elasticsearch:9200"
      Jwt__Secret: "${JWT_SECRET}"
      OAuth__Google__ClientId: "${GOOGLE_CLIENT_ID}"
      OAuth__Google__ClientIds: "${GOOGLE_CLIENT_IDS}"
      OAuth__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET}"
      Email__Provider: "${EMAIL_PROVIDER:-resend}"
      Email__ApiKey: "${RESEND_API_KEY}"
      Email__Resend__ApiKey: "${RESEND_API_KEY}"
      Email__FromEmail: "${EMAIL_FROM}"
      Email__FromName: "${EMAIL_FROM_NAME:-Craftora}"
      Email__ReplyTo: "${EMAIL_REPLY_TO:-support@craftoramedya.com}"
      ResendInbound__ApiKey: "${RESEND_INBOUND_API_KEY:-}"
      ResendInbound__WebhookSecret: "${RESEND_WEBHOOK_SECRET:-}"
      ResendInbound__SupportAddress: "${RESEND_SUPPORT_ADDRESS:-support@craftoramedya.com}"
      Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
      MINIO_INTERNAL_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT}"
      MINIO_USE_SSL: "false"
      MinIO__Endpoint: "minio:9000"
      MinIO__InternalEndpoint: "minio:9000"
      MinIO__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"
      MinIO__AccessKey: "${MINIO_ROOT_USER}"
      MinIO__SecretKey: "${MINIO_ROOT_PASSWORD}"
      MinIO__UseSSL: "false"
      MinIO__PublicUseSSL: "${MINIO_PUBLIC_USE_SSL}"
      Storage__ServiceUrl: "http://minio:9000"
      Storage__PublicServiceUrl: "${STORAGE_PUBLIC_SERVICE_URL}"
      Storage__AccessKey: "${MINIO_ROOT_USER}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Storage__ForcePathStyle: "true"
      Storage__CorsAllowedOrigins__0: "${CORS_ORIGIN_0}"
      Storage__CorsAllowedOrigins__1: "${CORS_ORIGIN_1:-}"
      Storage__CorsAllowedOrigins__2: "${CORS_ORIGIN_2:-}"
      Storage__CorsAllowedOrigins__3: "${CORS_ORIGIN_3:-}"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-}"
      Cors__AllowedOrigins__2: "${CORS_ORIGIN_2:-}"
      Cors__AllowedOrigins__3: "${CORS_ORIGIN_3:-}"
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID}"
      Firebase__CredentialsPath: "/run/secrets/firebase-service-account.json"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-service-account.json"
      Sentry__Dsn: "${SENTRY_DSN}"
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    expose:
      - "5000"
    networks:
      - craftora_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 1g
    logging: *default-logging

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: craftora_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/www/craftora/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - craftora_network
    depends_on:
      craftora_api:
        condition: service_started
    logging: *default-logging

  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: craftora_nginx
    profiles: ["disabled"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - craftora_network
    depends_on:
      craftora_api:
        condition: service_started
    mem_limit: 256m
    logging: *default-logging

networks:
  craftora_network:
    external: true
    name: craftora_craftora_network

volumes:
  postgres_data:
  minio_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  caddy_data:
    external: true
    name: craftora_caddy_data
  caddy_config:
    external: true
    name: craftora_caddy_config
